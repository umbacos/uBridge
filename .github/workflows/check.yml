name: Check
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]' aiohttp==3.14.5
      - run: ruff check custom_components tjc_bridge tests tools
      - run: ruff format --check custom_components tjc_bridge tests tools
      - run: pytest -q
      - run: python tools/check_firmware.py
  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.10.4
      - run: python tools/check_homeassistant.py
      - run: python tools/check_recorder.py
