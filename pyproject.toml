[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "homeassistant-tjc-hmi"
version = "0.8.0"
description = "Serial dashboard frontend for the TJC4827X243 X2"
requires-python = ">=3.13"
dependencies = ["pyserial==3.5", "pyserial-asyncio-fast==0.16", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "PyYAML>=6", "ruff>=0.9", "aiohttp==3.14.5", "keyring==25.7.0"]
bridge = ["aiohttp==3.14.5", "PySide6-Essentials==6.12.0", "keyring==25.7.0"]
build = ["pyinstaller==6.22.3", "build>=1.2"]
icons = ["Pillow==12.0.0"]

[project.scripts]
ubridge = "tjc_bridge.app:main"

[tool.setuptools]
packages = ["tjc_bridge", "tjc_display"]
package-dir = {"tjc_bridge" = "tjc_bridge", "tjc_display" = "custom_components/tjc_hmi/display"}

[tool.setuptools.package-data]
tjc_bridge = ["assets/*"]
tjc_display = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
